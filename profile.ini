# Arise - RTM - profil de jeu (GTA V PS4, vanilla)
# Toutes les clés sauf address_base et allowed_title_ids sont des handlers natifs
# de signature void f(NativeArg_s*).
# Les valeurs sont des adresses RELATIVES, ajoutées à address_base au runtime.
# address_base est l'adresse de chargement de l'image du jeu (0x400000 avec ASLR off).
# stat_set_int, stat_get_int et stat_save doivent passer le preflight ; les autres
# sont facultatifs et simplement désactivés sur ce build si leur contrôle d'entrée échoue.

[1.57]
address_base = 0x400000
allowed_title_ids = CUSA00411, CUSA00419

# --- Handlers de stats (cœur du RTM) ---
stat_set_int    = 0xACF4B0
stat_get_int    = 0xACF710
stat_save       = 0xACF0E0

stat_set_bool   = 0xACF520
stat_get_bool   = 0xACF820
stat_set_float  = 0xACF4E0
stat_get_float  = 0xACF7F0

packed_set_bool = 0xAD00F0
packed_get_bool = 0xACFF90
packed_set_int  = 0xAD0140
